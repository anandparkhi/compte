name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compte_test
          POSTGRES_PASSWORD: compte_test
          POSTGRES_DB: compte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compte_test -d compte_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://compte_test:compte_test@localhost:5432/compte_test
      DATABASE_URL: postgresql://compte_test:compte_test@localhost:5432/compte_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The PostgreSQL conversion removed the obsolete SQLite lockfile.
      # Regenerate and commit package-lock.json before switching to npm ci.
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
