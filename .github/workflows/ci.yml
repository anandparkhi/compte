name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compte
          POSTGRES_PASSWORD: compte_test_only
          POSTGRES_DB: compte_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compte -d compte_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://compte:compte_test_only@localhost:5432/compte_ci
      DIRECT_URL: postgresql://compte:compte_test_only@localhost:5432/compte_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This repository does not yet commit a lockfile; npm ci and node caching fail without it.
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run typecheck
      - name: Verify Vercel production migration step against temporary Postgres
        run: VERCEL_ENV=production node scripts/vercel-deploy-migrations.mjs
      - run: npm test
      - run: npm run build
      - name: Verify PDF fonts are included in the serverless bundle
        run: node scripts/check-pdf-trace.mjs
